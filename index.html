<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock CDA Chala</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

header {
    background: #d40000;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 6px 0 0;
    font-size: 14px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.filtros {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

input, select {
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    background: white;
}

input {
    flex: 1;
    min-width: 240px;
}

select {
    min-width: 220px;
}

.resumen {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.card {
    background: white;
    border-radius: 10px;
    padding: 15px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
}

.card strong {
    display: block;
    font-size: 25px;
    margin-top: 5px;
}

.tabla-contenedor {
    background: white;
    border-radius: 10px;
    overflow-x: auto;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #222;
    color: white;
    padding: 12px;
    text-align: left;
}

td {
    padding: 11px;
    border-bottom: 1px solid #eee;
}

.estado {
    font-weight: bold;
    border-radius: 6px;
    padding: 5px 9px;
    display: inline-block;
}

.ok {
    background: #d9f7df;
    color: #137333;
}

.critico {
    background: #fff0cc;
    color: #a15c00;
}

.agotado {
    background: #ffd9d9;
    color: #b00020;
}

.familia {
    font-weight: bold;
    color: #555;
}

.mensaje {
    text-align: center;
    padding: 25px;
    color: #777;
}

@media (max-width: 700px) {

    header h1 {
        font-size: 23px;
    }

    .container {
        padding: 12px;
    }

    .resumen {
        grid-template-columns: repeat(2, 1fr);
    }

    input, select {
        width: 100%;
    }

    th, td {
        font-size: 13px;
        padding: 9px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Stock CDA Chala</h1>
    <p>Consulta de stock en tiempo real</p>
</header>

<div class="container">

    <div class="filtros">

        <input
            type="text"
            id="buscador"
            placeholder="🔎 Buscar por SAP o producto..."
        >

        <select id="filtroFamilia">
            <option value="TODAS">📦 Todas las familias</option>
        </select>

    </div>

    <div class="resumen">

        <div class="card">
            PRODUCTOS
            <strong id="total">0</strong>
        </div>

        <div class="card">
            OK
            <strong id="ok">0</strong>
        </div>

        <div class="card">
            CRÍTICOS
            <strong id="criticos">0</strong>
        </div>

        <div class="card">
            AGOTADOS
            <strong id="agotados">0</strong>
        </div>

    </div>

    <div class="tabla-contenedor">

        <table>

            <thead>
                <tr>
                    <th>SAP</th>
                    <th>PRODUCTO</th>
                    <th>FAMILIA</th>
                    <th>STOCK</th>
                    <th>ESTADO</th>
                </tr>
            </thead>

            <tbody id="tablaStock"></tbody>

        </table>

        <div id="mensaje" class="mensaje">
            Cargando stock...
        </div>

    </div>

</div>

<script>

let productos = [];

const buscador = document.getElementById("buscador");
const filtroFamilia = document.getElementById("filtroFamilia");
const tablaStock = document.getElementById("tablaStock");
const mensaje = document.getElementById("mensaje");

async function cargarStock() {

    try {

        const respuesta = await fetch(
            "datos.json?v=" + Date.now(),
            { cache: "no-store" }
        );

        if (!respuesta.ok) {
            throw new Error("No se pudo cargar datos.json");
        }

        const datos = await respuesta.json();

        productos = Array.isArray(datos)
            ? datos
            : (datos.rows || []);

        crearFamilias();

        mostrarProductos();

    } catch (error) {

        mensaje.textContent =
            "Error al cargar el stock.";

        console.error(error);

    }
}

function crearFamilias() {

    const familias = [
        ...new Set(
            productos
            .map(p => p.familia || "")
            .filter(f => f !== "")
        )
    ].sort();

    filtroFamilia.innerHTML =
        '<option value="TODAS">📦 Todas las familias</option>';

    familias.forEach(familia => {

        const opcion = document.createElement("option");

        opcion.value = familia;
        opcion.textContent = familia;

        filtroFamilia.appendChild(opcion);

    });
}

function mostrarProductos() {

    const texto =
        buscador.value
        .toLowerCase()
        .trim();

    const familiaSeleccionada =
        filtroFamilia.value;

    const filtrados = productos.filter(p => {

        const sap =
            String(
                p.sap ??
                p.SAP ??
                p.codigo_sap ??
                p.CODIGO_SAP ??
                ""
            );

        const descripcion =
            String(
                p.descripcion ??
                p.DESCRIPCION ??
                p.producto ??
                p.PRODUCTO ??
                ""
            );

        const familia =
            String(p.familia ?? "");

        const coincideTexto =
            sap.toLowerCase().includes(texto) ||
            descripcion.toLowerCase().includes(texto);

        const coincideFamilia =
            familiaSeleccionada === "TODAS" ||
            familia === familiaSeleccionada;

        return coincideTexto && coincideFamilia;

    });

    actualizarResumen(filtrados);

    tablaStock.innerHTML = "";

    if (filtrados.length === 0) {

        mensaje.style.display = "block";
        mensaje.textContent = "No se encontraron productos.";

        return;

    }

    mensaje.style.display = "none";

    filtrados.forEach(p => {

        const sap =
            p.sap ??
            p.SAP ??
            p.codigo_sap ??
            p.CODIGO_SAP ??
            "";

        const descripcion =
            p.descripcion ??
            p.DESCRIPCION ??
            p.producto ??
            p.PRODUCTO ??
            "";

        const stock =
            p.stock_total ??
            p.STOCK_TOTAL ??
            p.stock ??
            p.STOCK ??
            0;

        const estado =
            p.estado ??
            p.ESTADO ??
            "";

        const familia =
            p.familia ??
            "";

        let claseEstado = "";

        if (estado === "OK") {
            claseEstado = "ok";
        }
        else if (estado === "CRÍTICO") {
            claseEstado = "critico";
        }
        else if (estado === "AGOTADO") {
            claseEstado = "agotado";
        }

        const fila = document.createElement("tr");

        fila.innerHTML = `
            <td>${sap}</td>

            <td>${descripcion}</td>

            <td class="familia">
                ${familia}
            </td>

            <td>
                ${Number(stock).toLocaleString("es-PE", {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                })}
            </td>

            <td>
                <span class="estado ${claseEstado}">
                    ${estado}
                </span>
            </td>
        `;

        tablaStock.appendChild(fila);

    });

}

function actualizarResumen(lista) {

    document.getElementById("total").textContent =
        lista.length;

    document.getElementById("ok").textContent =
        lista.filter(p =>
            (p.estado ?? p.ESTADO) === "OK"
        ).length;

    document.getElementById("criticos").textContent =
        lista.filter(p =>
            (p.estado ?? p.ESTADO) === "CRÍTICO"
        ).length;

    document.getElementById("agotados").textContent =
        lista.filter(p =>
            (p.estado ?? p.ESTADO) === "AGOTADO"
        ).length;
}

buscador.addEventListener(
    "input",
    mostrarProductos
);

filtroFamilia.addEventListener(
    "change",
    mostrarProductos
);

cargarStock();

</script>

</body>
</html>
