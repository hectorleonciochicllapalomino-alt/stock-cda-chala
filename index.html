<!doctype html>

<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#174a78">
<title>Stock CDA Chala</title><style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:#f3f6fa;
 color:#10243e;
}

.header{
 background:#174a78;
 color:#fff;
 padding:20px 16px;
}

.header h1{
 margin:0;
 font-size:28px;
}

.header p{
 margin:6px 0 0;
 font-size:14px;
 opacity:.9;
}

.container{
 max-width:1180px;
 margin:auto;
 padding:16px;
}

.search{
 width:100%;
 padding:14px 16px;
 border:1px solid #ccd6e0;
 border-radius:10px;
 font-size:16px;
 margin-bottom:15px;
 outline:none;
}

.search:focus{
 border-color:#174a78;
 box-shadow:0 0 0 2px rgba(23,74,120,.12);
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px;
 margin-bottom:15px;
}

.card{
 background:#fff;
 border-radius:10px;
 padding:12px;
 box-shadow:0 2px 8px rgba(0,0,0,.06);
 text-align:center;
}

.card b{
 display:block;
 font-size:22px;
 margin-bottom:4px;
}

.card span{
 font-size:11px;
 color:#64748b;
}

.table-box{
 background:#fff;
 border-radius:12px;
 overflow:hidden;
 box-shadow:0 2px 10px rgba(0,0,0,.07);
}

table{
 width:100%;
 border-collapse:collapse;
 table-layout:fixed;
}

th{
 background:#174a78;
 color:#fff;
 padding:11px 8px;
 font-size:12px;
 text-align:left;
}

td{
 padding:11px 8px;
 border-bottom:1px solid #edf1f5;
 font-size:13px;
 word-wrap:break-word;
}

th:nth-child(1),td:nth-child(1){width:22%}
th:nth-child(2),td:nth-child(2){width:43%}
th:nth-child(3),td:nth-child(3){width:18%;text-align:center}
th:nth-child(4),td:nth-child(4){width:17%;text-align:center}

.badge{
 display:inline-block;
 padding:5px 7px;
 border-radius:20px;
 font-size:11px;
 font-weight:bold;
}

.verde{background:#dcfce7;color:#166534}
.amarillo{background:#fef3c7;color:#92400e}
.anaranjado{background:#ffedd5;color:#9a3412}
.rojo{background:#fee2e2;color:#991b1b}

.empty{
 padding:35px 15px;
 text-align:center;
 color:#64748b;
}

@media(max-width:600px){

 .header{
  padding:16px;
 }

 .header h1{
  font-size:23px;
 }

 .container{
  padding:10px;
 }

 .stats{
  grid-template-columns:repeat(4,1fr);
  gap:6px;
 }

 .card{
  padding:9px 4px;
 }

 .card b{
  font-size:17px;
 }

 .card span{
  font-size:9px;
 }

 th{
  padding:9px 5px;
  font-size:10px;
 }

 td{
  padding:9px 5px;
  font-size:11px;
 }

 th:nth-child(1),td:nth-child(1){width:25%}
 th:nth-child(2),td:nth-child(2){width:39%}
 th:nth-child(3),td:nth-child(3){width:18%}
 th:nth-child(4),td:nth-child(4){width:18%}
}
</style></head><body><div class="header">
 <h1>Stock CDA Chala</h1>
 <p>Consulta de stock para vendedores</p>
</div><div class="container"><input
id="busqueda"
class="search"
type="search"
placeholder="🔎 Buscar por SAP o producto..."

«»

 <div class="stats">
  <div class="card">
   <b id="total">0</b>
   <span>PRODUCTOS</span>
  </div>  <div class="card">
   <b id="ok">0</b>
   <span>OK</span>
  </div>  <div class="card">
   <b id="criticos">0</b>
   <span>CRÍTICOS</span>
  </div>  <div class="card">
   <b id="agotados">0</b>
   <span>AGOTADOS</span>
  </div>
 </div> <div class="table-box">  <table>
   <thead>
    <tr>
     <th>SAP</th>
     <th>PRODUCTO</th>
     <th>STOCK</th>
     <th>ESTADO</th>
    </tr>
   </thead>   <tbody id="tabla"></tbody>  </table>  <div id="vacio" class="empty">
   Cargando información...
  </div> </div></div><script>

let productos=[];

function normalizar(texto){
 return String(texto ?? "")
  .normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"")
  .toLowerCase()
  .trim();
}

function obtenerStock(p){
 let valor=p.stock_total;

 if(valor===undefined) valor=p.STOCK_TOTAL;
 if(valor===undefined) valor=p.stock;
 if(valor===undefined) valor=p.STOCK;

 let numero=Number(valor);

 return Number.isFinite(numero) ? numero : 0;
}

function obtenerSAP(p){
 return p.sap ?? p.SAP ?? p.codigo_sap ?? p.CODIGO_SAP ?? "";
}

function obtenerProducto(p){
 return p.descripcion ?? p.DESCRIPCION ?? p.producto ?? p.PRODUCTO ?? "";
}

function calcularEstado(stock){

 if(stock<=5) return {
  texto:"AGOTADO",
  clase:"rojo"
 };

 if(stock<=15) return {
  texto:"CRÍTICO",
  clase:"anaranjado"
 };

 if(stock<=50) return {
  texto:"BAJO",
  clase:"amarillo"
 };

 return {
  texto:"OK",
  clase:"verde"
 };

}

function mostrar(){

 const texto=normalizar(
  document.getElementById("busqueda").value
 );

 const filtrados=productos.filter(p=>{

  const sap=normalizar(obtenerSAP(p));
  const producto=normalizar(obtenerProducto(p));

  return sap.includes(texto) || producto.includes(texto);

 });

 document.getElementById("total").textContent=filtrados.length;

 let ok=0;
 let criticos=0;
 let agotados=0;

 filtrados.forEach(p=>{

  const stock=obtenerStock(p);

  if(stock>50) ok++;
  else if(stock>5) criticos++;
  else agotados++;

 });

 document.getElementById("ok").textContent=ok;
 document.getElementById("criticos").textContent=criticos;
 document.getElementById("agotados").textContent=agotados;

 const tabla=document.getElementById("tabla");
 const vacio=document.getElementById("vacio");

 tabla.innerHTML="";

 if(filtrados.length===0){

  vacio.style.display="block";
  vacio.textContent="No se encontraron productos";

  return;

 }

 vacio.style.display="none";

 filtrados.forEach(p=>{

  const sap=obtenerSAP(p);
  const producto=obtenerProducto(p);
  const stock=obtenerStock(p);
  const estado=calcularEstado(stock);

  const fila=document.createElement("tr");

  fila.innerHTML=`
   <td>${sap}</td>
   <td>${producto}</td>
   <td><strong>${stock.toFixed(2)}</strong></td>
   <td>
    <span class="badge ${estado.clase}">
     ${estado.texto}
    </span>
   </td>
  `;

  tabla.appendChild(fila);

 });

}

async function cargarDatos(){

 try{

  const respuesta=await fetch(
   "datos.json?v="+Date.now(),
   {cache:"no-store"}
  );

  if(!respuesta.ok){
   throw new Error("No se pudo cargar datos.json");
  }

  const datos=await respuesta.json();

  productos=Array.isArray(datos)
   ? datos
   : (Array.isArray(datos.rows) ? datos.rows : []);

  mostrar();

 }catch(error){

  console.error(error);

  document.getElementById("total").textContent="0";

  document.getElementById("tabla").innerHTML="";

  document.getElementById("vacio").style.display="block";

  document.getElementById("vacio").textContent=
   "Error al cargar los datos";

 }

}

document
 .getElementById("busqueda")
 .addEventListener("input",mostrar);

cargarDatos();

</script></body>
</html>
